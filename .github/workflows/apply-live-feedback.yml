name: Apply live feedback fixes

on:
  push:
    branches: [feat/github-cli-sync-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/github-cli-sync-ui
          fetch-depth: 0
      - name: Apply guarded UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("src/nix_settings/backend/cache.py").write_text('''from __future__ import annotations\n\nimport json\nimport os\nimport re\nfrom pathlib import Path\nfrom typing import Any, Mapping\n\n_KEY_RE = re.compile(r"^[a-z0-9][a-z0-9._-]{0,80}$")\n\n\nclass JsonCache:\n    """Small fail-soft cache for non-secret structured UI snapshots."""\n\n    def __init__(self, root: Path | None = None) -> None:\n        if root is None:\n            base = Path(os.environ.get("XDG_CACHE_HOME", Path.home() / ".cache"))\n            root = base / "nix-settings"\n        self.root = root\n\n    def _path(self, key: str) -> Path:\n        if not _KEY_RE.fullmatch(key):\n            raise ValueError("invalid cache key")\n        return self.root / f"{key}.json"\n\n    def load(self, key: str) -> Mapping[str, Any] | None:\n        path = self._path(key)\n        try:\n            value = json.loads(path.read_text(encoding="utf-8"))\n        except (OSError, json.JSONDecodeError):\n            return None\n        if not isinstance(value, dict) or value.get("cacheVersion") != 1:\n            return None\n        payload = value.get("payload")\n        return payload if isinstance(payload, dict) else None\n\n    def save(self, key: str, payload: object) -> None:\n        if not isinstance(payload, Mapping):\n            return\n        path = self._path(key)\n        try:\n            self.root.mkdir(parents=True, exist_ok=True, mode=0o700)\n            temporary = path.with_name(f".{path.name}.{os.getpid()}.tmp")\n            temporary.write_text(\n                json.dumps({"cacheVersion": 1, "payload": dict(payload)}, sort_keys=True) + "\\n",\n                encoding="utf-8",\n            )\n            temporary.chmod(0o600)\n            os.replace(temporary, path)\n        except OSError:\n            try:\n                temporary.unlink(missing_ok=True)\n            except (OSError, UnboundLocalError):\n                pass\n''', encoding="utf-8")

          Path("src/nix_settings/gui/modal.py").write_text('''from __future__ import annotations\n\nfrom typing import Any\n\n\ndef prepare_layer_dialog(dialog: Any) -> None:\n    """Keep modal GTK3 dialogs above the layer-shell main surface."""\n    import gi\n\n    gi.require_version("GtkLayerShell", "0.1")\n    from gi.repository import GtkLayerShell\n\n    dialog.set_decorated(False)\n    dialog.set_app_paintable(True)\n    dialog.get_style_context().add_class("nix-settings-root")\n    screen = dialog.get_screen()\n    visual = screen.get_rgba_visual() if screen is not None else None\n    if visual is not None:\n        dialog.set_visual(visual)\n    GtkLayerShell.init_for_window(dialog)\n    GtkLayerShell.set_layer(dialog, GtkLayerShell.Layer.OVERLAY)\n    GtkLayerShell.set_keyboard_mode(dialog, GtkLayerShell.KeyboardMode.EXCLUSIVE)\n    GtkLayerShell.set_exclusive_zone(dialog, 0)\n    GtkLayerShell.set_namespace(dialog, "nix-settings-modal")\n''', encoding="utf-8")

          Path("tests/test_cache.py").write_text('''from pathlib import Path\n\nfrom nix_settings.backend.cache import JsonCache\n\n\ndef test_json_cache_round_trip(tmp_path: Path) -> None:\n    cache = JsonCache(tmp_path)\n    payload = {"host": "nyx", "diskUsedPercent": 66, "errors": []}\n    cache.save("system-status", payload)\n    assert cache.load("system-status") == payload\n\n\ndef test_json_cache_ignores_corruption(tmp_path: Path) -> None:\n    cache = JsonCache(tmp_path)\n    tmp_path.mkdir(parents=True, exist_ok=True)\n    (tmp_path / "system-status.json").write_text("not-json", encoding="utf-8")\n    assert cache.load("system-status") is None\n''', encoding="utf-8")

          Path("tests/test_sync_backend.py").write_text('''from nix_settings.backend.process import BackendCommands\n\n\ndef test_sync_status_uses_packaged_contract_not_checkout_adapter() -> None:\n    command = BackendCommands.sync_status("all")\n    assert command == ["config-sync", "status", "--json", "--scope", "all"]\n    assert "config-sync-json.py" not in " ".join(command)\n''', encoding="utf-8")

          replace_once(
              "src/nix_settings/backend/process.py",
              '''    def sync_status(scope: str, *, offline: bool = False) -> list[str]:\n        repo = config_repo()\n        if repo is None:\n            raise ProcessError("Nix configuration repository was not found")\n        adapter = repo / "scripts/config-sync-json.py"\n        if not adapter.is_file():\n            raise ProcessError(f"structured config-sync adapter is missing: {adapter}")\n        result = [sys.executable, str(adapter), "status", "--scope", scope]\n        if offline:\n            result.append("--offline")\n        return result\n''',
              '''    def sync_status(scope: str, *, offline: bool = False) -> list[str]:\n        result = ["config-sync", "status", "--json", "--scope", scope]\n        if offline:\n            result.append("--offline")\n        return result\n''',
          )

          # Overview: cached snapshot immediately, fresh local/online results replace it.
          replace_once(
              "src/nix_settings/gui/pages/overview.py",
              "from nix_settings.backend.models import SystemStatus, format_bytes\n",
              "from nix_settings.backend.cache import JsonCache\nfrom nix_settings.backend.models import SystemStatus, format_bytes\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/overview.py",
              "        self.runner = JsonRunner(timeout=45.0)\n",
              "        self.runner = JsonRunner(timeout=45.0)\n        self.cache = JsonCache()\n        self._has_snapshot = False\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/overview.py",
              '''        self._started = True\n        self.refresh()\n\n    def refresh(self) -> None:\n''',
              '''        self._started = True\n        cached = self.cache.load("system-status")\n        if cached is not None:\n            try:\n                value = SystemStatus.from_json(cached)\n            except Exception:\n                pass\n            else:\n                self._apply_status(value)\n                self.values["snapshot"].set_text(f"Cached · {value.updated_at}")\n                self.values["online"].set_text("Refreshing…")\n        self.refresh()\n\n    def refresh(self) -> None:\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/overview.py",
              '''    def _load_local(self) -> SystemStatus:\n        return SystemStatus.from_json(self.runner.run(BackendCommands.status(online=False)).json())\n\n    def _load_online(self) -> SystemStatus:\n        return SystemStatus.from_json(self.runner.run(BackendCommands.status(online=True)).json())\n''',
              '''    def _load_local(self) -> SystemStatus:\n        payload = self.runner.run(BackendCommands.status(online=False)).json()\n        self.cache.save("system-status", payload)\n        return SystemStatus.from_json(payload)\n\n    def _load_online(self) -> SystemStatus:\n        payload = self.runner.run(BackendCommands.status(online=True)).json()\n        self.cache.save("system-status", payload)\n        return SystemStatus.from_json(payload)\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/overview.py",
              '''        if error is not None or value is None:\n            self.values["snapshot"].set_text("Failed")\n            self.error.set_text(str(error or "Unknown status error"))\n        else:\n''',
              '''        if error is not None or value is None:\n            self.values["snapshot"].set_text(\n                "Cached · refresh failed" if self._has_snapshot else "Failed"\n            )\n            self.error.set_text(str(error or "Unknown status error"))\n        else:\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/overview.py",
              '''        if error is not None or value is None:\n            self.values["online"].set_text("Failed")\n            self.error.set_text(str(error or "Online status failed"))\n        else:\n''',
              '''        if error is not None or value is None:\n            self.values["online"].set_text("Cached" if self._has_snapshot else "Failed")\n            self.error.set_text(str(error or "Online status failed"))\n        else:\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/overview.py",
              '''    def _apply_status(self, value: SystemStatus) -> None:\n        self.values["host"].set_text(value.host)\n''',
              '''    def _apply_status(self, value: SystemStatus) -> None:\n        self._has_snapshot = True\n        self.values["host"].set_text(value.host)\n''',
          )

          # Storage shares the same system-status cache.
          replace_once(
              "src/nix_settings/gui/pages/storage.py",
              "from nix_settings.backend.models import CleanPreview, SystemStatus, format_bytes\n",
              "from nix_settings.backend.cache import JsonCache\nfrom nix_settings.backend.models import CleanPreview, SystemStatus, format_bytes\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/storage.py",
              "        self.runner = JsonRunner(timeout=120.0)\n",
              "        self.runner = JsonRunner(timeout=120.0)\n        self.cache = JsonCache()\n        self._has_status = False\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/storage.py",
              '''        self._started = True\n        self.refresh()\n\n    def refresh(self) -> None:\n''',
              '''        self._started = True\n        cached = self.cache.load("system-status")\n        if cached is not None:\n            try:\n                self._apply_status(SystemStatus.from_json(cached), None)\n            except Exception:\n                pass\n        self.refresh()\n\n    def _load_status(self) -> SystemStatus:\n        payload = self.runner.run(BackendCommands.status(online=False)).json()\n        self.cache.save("system-status", payload)\n        return SystemStatus.from_json(payload)\n\n    def refresh(self) -> None:\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/storage.py",
              '''            lambda: SystemStatus.from_json(\n                self.runner.run(BackendCommands.status(online=False)).json()\n            ),\n''',
              '''            self._load_status,\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/storage.py",
              '''        if error is not None or value is None:\n            self.values["status"].set_text("Failed")\n            self.log.append(str(error or "Unknown storage status error"), error=True)\n            return False\n        self.values["store"].set_text(format_bytes(value.store_bytes))\n''',
              '''        if error is not None or value is None:\n            self.values["status"].set_text("Cached · refresh failed" if self._has_status else "Failed")\n            self.log.append(str(error or "Unknown storage status error"), error=True)\n            return False\n        self._has_status = True\n        self.values["store"].set_text(format_bytes(value.store_bytes))\n''',
          )

          # System page shares the same cache.
          replace_once(
              "src/nix_settings/gui/pages/system.py",
              "from nix_settings.backend.models import SystemStatus\n",
              "from nix_settings.backend.cache import JsonCache\nfrom nix_settings.backend.models import SystemStatus\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/system.py",
              "        self.runner = JsonRunner(timeout=90.0)\n",
              "        self.runner = JsonRunner(timeout=90.0)\n        self.cache = JsonCache()\n        self._has_status = False\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/system.py",
              '''        self._started = True\n        self.refresh()\n\n    def _refresh_clicked''',
              '''        self._started = True\n        cached = self.cache.load("system-status")\n        if cached is not None:\n            try:\n                self._apply_status(SystemStatus.from_json(cached), None)\n            except Exception:\n                pass\n        self.refresh()\n\n    def _refresh_clicked''',
          )
          replace_once(
              "src/nix_settings/gui/pages/system.py",
              '''            value = SystemStatus.from_json(\n                self.runner.run(BackendCommands.status(online=False)).json()\n            )\n''',
              '''            payload = self.runner.run(BackendCommands.status(online=False)).json()\n            self.cache.save("system-status", payload)\n            value = SystemStatus.from_json(payload)\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/system.py",
              '''        if error is not None or value is None:\n            self.values["state"].set_text("Failed")\n            self.log.append(str(error or "Unknown status error"), error=True)\n            return False\n        self.values["host"].set_text(value.host)\n''',
              '''        if error is not None or value is None:\n            self.values["state"].set_text("Cached · refresh failed" if self._has_status else "Failed")\n            self.log.append(str(error or "Unknown status error"), error=True)\n            return False\n        self._has_status = True\n        self.values["host"].set_text(value.host)\n''',
          )

          # Generations snapshot cache.
          replace_once(
              "src/nix_settings/gui/pages/generations.py",
              "from nix_settings.backend.models import GenerationStatus, format_bytes\n",
              "from nix_settings.backend.cache import JsonCache\nfrom nix_settings.backend.models import GenerationStatus, format_bytes\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/generations.py",
              "        self.runner = JsonRunner(timeout=120.0)\n",
              "        self.runner = JsonRunner(timeout=120.0)\n        self.cache = JsonCache()\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/generations.py",
              '''        self._started = True\n        self.refresh()\n\n    def refresh(self) -> None:\n''',
              '''        self._started = True\n        cached = self.cache.load("generations")\n        if cached is not None:\n            try:\n                self._apply(GenerationStatus.from_json(cached), None)\n            except Exception:\n                pass\n        self.refresh()\n\n    def _load_generations(self) -> GenerationStatus:\n        payload = self.runner.run(BackendCommands.generations()).json()\n        self.cache.save("generations", payload)\n        return GenerationStatus.from_json(payload)\n\n    def refresh(self) -> None:\n''',
          )
          replace_once(
              "src/nix_settings/gui/pages/generations.py",
              '''            lambda: GenerationStatus.from_json(\n                self.runner.run(BackendCommands.generations()).json()\n            ),\n''',
              '''            self._load_generations,\n''',
          )

          # Config Sync cache: never blank good data while a refresh is running/fails.
          replace_once(
              "src/nix_settings/gui/pages/sync.py",
              "from nix_settings.backend.models import GitHubSyncStatus, SyncStatus\n",
              "from nix_settings.backend.cache import JsonCache\nfrom nix_settings.backend.models import GitHubSyncStatus, SyncStatus\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/sync.py",
              "        self.runner = JsonRunner(timeout=180.0)\n",
              "        self.runner = JsonRunner(timeout=180.0)\n        self.cache = JsonCache()\n",
          )
          replace_once(
              "src/nix_settings/gui/pages/sync.py",
              '''    def refresh(self) -> None:\n        if self.busy:\n            return\n        scope = self.scope.get_active_id() or "all"\n        generation = self.gate.begin()\n        self.values["plan"].set_text("Loading…")\n        self.github_badge.set_text("CHECKING")\n        self.gate.run(\n            generation,\n            lambda: SyncStatus.from_json(\n                self.runner.run(BackendCommands.sync_status(scope)).json()\n            ),\n            self._status_finished,\n        )\n''',
              '''    def refresh(self) -> None:\n        if self.busy:\n            return\n        scope = self.scope.get_active_id() or "all"\n        cached = self.cache.load(f"sync-status-{scope}")\n        if cached is not None:\n            try:\n                cached_status = SyncStatus.from_json(cached)\n            except Exception:\n                pass\n            else:\n                self._render_status(cached_status, cached=True)\n        generation = self.gate.begin()\n        self.operation_status.set_text("Refreshing status…")\n        self.gate.run(generation, lambda: self._load_status(scope), self._status_finished)\n\n    def _load_status(self, scope: str) -> SyncStatus:\n        payload = self.runner.run(BackendCommands.sync_status(scope)).json()\n        self.cache.save(f"sync-status-{scope}", payload)\n        return SyncStatus.from_json(payload)\n''',
          )
          old_apply = '''    def _apply_status(self, value: SyncStatus | None, error: Exception | None) -> bool:\n        if error is not None or value is None:\n            self.current_status = None\n            self.values["plan"].set_text("Failed")\n            self.github_badge.set_text("ERROR")\n            self.log.append(str(error or "Unknown config-sync status error"), error=True)\n            self._set_actions_sensitive(True)\n            return False\n\n        self.current_status = value\n        self.values["repo"].set_text(value.repository_path)\n'''
          new_apply = '''    def _apply_status(self, value: SyncStatus | None, error: Exception | None) -> bool:\n        if error is not None or value is None:\n            if self.current_status is None:\n                self.values["plan"].set_text("Failed")\n                self.github_badge.set_text("ERROR")\n            self.operation_status.set_text(\n                "Status refresh failed · cached data kept"\n                if self.current_status is not None\n                else "Status refresh failed"\n            )\n            self.log.append(str(error or "Unknown config-sync status error"), error=True)\n            self._set_actions_sensitive(True)\n            return False\n        self._render_status(value, cached=False)\n        return False\n\n    def _render_status(self, value: SyncStatus, *, cached: bool) -> None:\n        self.current_status = value\n        self.values["repo"].set_text(value.repository_path)\n'''
          replace_once("src/nix_settings/gui/pages/sync.py", old_apply, new_apply)
          replace_once(
              "src/nix_settings/gui/pages/sync.py",
              '''        self._set_actions_sensitive(True)\n        return False\n\n    def _login_clicked''',
              '''        self.operation_status.set_text("Cached snapshot · refreshing…" if cached else "Ready")\n        self._set_actions_sensitive(True)\n\n    def _login_clicked''',
          )

          # Keep all modal confirmations above the layer-shell window.
          for page in ("sync.py", "system.py", "storage.py", "generations.py", "updates.py"):
              path = Path("src/nix_settings/gui/pages") / page
              text = path.read_text(encoding="utf-8")
              if "from nix_settings.gui.modal import prepare_layer_dialog\n" not in text:
                  anchor = "from nix_settings.gui.widgets"
                  index = text.find(anchor)
                  if index < 0:
                      raise SystemExit(f"modal import anchor missing: {page}")
                  text = text[:index] + "from nix_settings.gui.modal import prepare_layer_dialog\n" + text[index:]
              text = text.replace("        response = dialog.run()\n", "        prepare_layer_dialog(dialog)\n        response = dialog.run()\n")
              path.write_text(text, encoding="utf-8")

          # Header children are centered instead of vertically filling the fixed title bar.
          replace_once(
              "src/nix_settings/gui/window.py",
              '''        header = self.Gtk.Grid()\n        header.set_column_spacing(10)\n        header.set_hexpand(True)\n        header.set_size_request(-1, HEADER_HEIGHT)\n''',
              '''        header = self.Gtk.Grid()\n        header.get_style_context().add_class("main-header")\n        header.set_column_spacing(10)\n        header.set_hexpand(True)\n        header.set_vexpand(False)\n        header.set_size_request(-1, HEADER_HEIGHT)\n''',
          )
          replace_once(
              "src/nix_settings/gui/window.py",
              '''        self.home_button.set_size_request(32, 30)\n        self.home_button.set_tooltip_text("Overview")\n''',
              '''        self.home_button.set_size_request(32, 30)\n        self.home_button.set_valign(self.Gtk.Align.CENTER)\n        self.home_button.set_tooltip_text("Overview")\n''',
          )
          replace_once(
              "src/nix_settings/gui/window.py",
              '''        self.refresh_button.set_size_request(88, 30)\n        self.refresh_button.set_halign(self.Gtk.Align.END)\n''',
              '''        self.refresh_button.set_size_request(88, 30)\n        self.refresh_button.set_halign(self.Gtk.Align.END)\n        self.refresh_button.set_valign(self.Gtk.Align.CENTER)\n''',
          )

          # One-pixel readability bump everywhere, including Sound, without changing outer geometry.
          css = Path("src/nix_settings/gui/style.css")
          text = css.read_text(encoding="utf-8")
          replacements = {
              "font-size: 20px;": "font-size: 21px;",
              "font-size: 11px;": "font-size: 12px;",
              "font-size: 13px;": "font-size: 14px;",
              "font-size: 10px;": "font-size: 11px;",
              "font-size: 15px;": "font-size: 16px;",
              "font-size: 12px;": "font-size: 13px;",
              "font-size: 14px;": "font-size: 15px;",
          }
          # Apply based on original values in a single regex-like pass to avoid cascading increments.
          import re
          def bump(match: re.Match[str]) -> str:
              value = int(match.group(1))
              return f"font-size: {value + 1}px;"
          text = re.sub(r"font-size: (10|11|12|13|14|15|20)px;", bump, text)
          if ".main-header" not in text:
              text += "\n.main-header {\n  min-height: 52px;\n}\n"
          css.write_text(text, encoding="utf-8")
          PY
      - name: Validate patched UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src tests
          PYTHONPATH=src python3 -m pytest -q tests/test_cache.py tests/test_sync_backend.py tests/test_backend_models.py tests/test_cli.py tests/test_layout.py tests/test_requests.py tests/test_security.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m 'fix(ui): cache snapshots and repair layer-shell sync flow'
          git push origin HEAD:feat/github-cli-sync-ui
