name: Apply sync style patch once

on:
  push:
    branches: [feat/github-cli-sync-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-cli-sync-ui
      - name: Reuse existing Nix Settings classes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/nix_settings/gui/pages/sync.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"status-chip"': '"status-text"',
              '"sync-progress"': '"deck-progress"',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"missing expected style marker: {old}")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit style patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/nix_settings/gui/pages/sync.py
          git commit -m "style(sync): reuse existing progress and status styles"
          git push origin HEAD:feat/github-cli-sync-ui
