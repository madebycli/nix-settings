name: CI
# Verifies the current public direct-repository installation path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Verify committed lock file
        run: |
          set -euo pipefail
          nix flake lock
          git diff --exit-code -- flake.lock

      - name: Evaluate and test Flake
        run: |
          set -euo pipefail
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs

      - name: Build and smoke-test package
        run: |
          set -euo pipefail
          nix build .#nix-settings --no-write-lock-file --print-build-logs
          test -x ./result/bin/nix-settings
          ./result/bin/nix-settings --version
          ./result/bin/nix-settings --help | grep -q doctor

      - name: Verify direct GitHub profile install
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/nix-settings-profile
          DIRECT_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" \
            "github:${GITHUB_REPOSITORY}/${DIRECT_REV}#nix-settings"
          test -x "$DIRECT_PROFILE/bin/nix-settings"
          "$DIRECT_PROFILE/bin/nix-settings" --version
          "$DIRECT_PROFILE/bin/nix-settings" --help | grep -q overview
