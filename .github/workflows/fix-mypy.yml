name: Fix MyPy booleans once

on:
  push:
    branches: [feat/system-management-shell]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/system-management-shell
      - name: Make dialog decisions explicit booleans
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/nix_settings/gui/pages/sync.py")
          text = path.read_text(encoding="utf-8")
          old = "return response == self.Gtk.ResponseType.OK"
          new = "return bool(response == self.Gtk.ResponseType.OK)"
          count = text.count(old)
          if count not in {0, 2}:
              raise SystemExit(f"unexpected return count: {count}")
          if count == 2:
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit type fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/nix_settings/gui/pages/sync.py
          git commit -m "fix(types): make dialog decisions explicit booleans"
          git push origin HEAD:feat/system-management-shell
