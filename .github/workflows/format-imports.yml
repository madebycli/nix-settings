name: Format imports once

on:
  push:
    branches: [feat/system-management-shell]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/system-management-shell
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Fix remaining import blocks
        run: |
          ruff check --select I --fix \
            src/nix_settings/gui/pages/system.py \
            tests/test_security.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/nix_settings/gui/pages/system.py tests/test_security.py
          git commit -m "fix(lint): sort remaining imports"
          git push origin HEAD:feat/system-management-shell
