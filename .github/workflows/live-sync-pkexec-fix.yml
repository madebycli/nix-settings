name: Apply guarded Sync conflict and pkexec fix

on:
  push:
    branches:
      - feat/github-cli-sync-ui
    paths:
      - .github/workflows/live-sync-pkexec-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/github-cli-sync-ui
          fetch-depth: 0
      - name: Apply guarded UI patch
        run: python3 .github/live_ui_conflict_pkexec_patch.py
      - name: Validate source tests
        run: |
          set -euo pipefail
          python3 -m compileall -q src
          python3 -m pytest -q
      - name: Commit UI patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nix_settings/backend/process.py src/nix_settings/gui/pages/sync.py tests/test_sync_backend.py tests/test_github_sync_ui.py
          git diff --cached --check
          git commit -m 'fix(sync): resolve conflicts and use NixOS pkexec wrapper'
          git push origin HEAD:feat/github-cli-sync-ui
