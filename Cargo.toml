[package]
name = "nix-sound"
version = "1.0.6"
edition = "2024"
rust-version = "1.86"
description = "Native Noctalia sound overlay and event-driven audio backend"
license = "MIT"

[[bin]]
name = "nix-settings"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml_edit = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
